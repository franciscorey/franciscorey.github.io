<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE_LAB — BLUEPRINT HIGH-FI / 2026</title>
    <meta name="description" content="Archivo experimental de Francisco Rey. Puro impacto visual sin contexto.">
    <link rel="stylesheet" href="index.css">
    <style>
        .lab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--grid-unit);
            padding: var(--grid-unit);
        }

        .lab-item {
            aspect-ratio: 1;
            background: #111;
            overflow: hidden;
            position: relative;
        }

        .lab-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) brightness(0.8);
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        .lab-item:hover img {
            filter: grayscale(0) brightness(1.2);
            transform: scale(1.1);
        }

        /* Lab ID label */
        .lab-item .lab-id {
            position: absolute;
            bottom: 8px;
            left: 10px;
            font-family: var(--font-meta);
            font-size: 9px;
            color: white;
            opacity: 0;
            transition: opacity 0.3s;
            letter-spacing: 0.1em;
        }

        .lab-item:hover .lab-id {
            opacity: 1;
        }
    </style>
</head>
<body>

    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">&#9776;</button>
    <div class="nav-overlay" id="navOverlay"></div>

    <aside class="sidebar-nav" id="sidebarNav" role="navigation" aria-label="Navegación principal">
        <a href="index.html" class="brand" aria-label="Inicio">FRANCISCO REY<br>VISUAL DESIGNER</a>
        <nav>

            <a href="case-study.html">PROJECTS</a>
            <a href="lab.html" class="active" aria-current="page">THE_LAB</a>
            <a href="about.html">ABOUT</a>
        </nav>
        <span class="year">2026</span>
    </aside>

    <div class="page-content">

            <h1 style="grid-column: span 8; font-size: clamp(2rem, 5vw, 4rem);">The_Lab</h1>
            <p class="metadata" style="grid-column: span 12;">03_THE_LAB (ARCHIVO) / PURE IMPACT / NO CONTEXT</p>
        </header>

        <main class="lab-grid">
            <div class="lab-item reveal" data-id="001"><img src="assets/p1-final.png" alt="Lab 001"><span class="lab-id">EXP_001</span></div>
            <div class="lab-item reveal" data-id="002"><img src="assets/p2-final.png" alt="Lab 002"><span class="lab-id">EXP_002</span></div>
            <div class="lab-item reveal" data-id="003"><img src="assets/p3-final.png" alt="Lab 003"><span class="lab-id">EXP_003</span></div>
            <div class="lab-item reveal" data-id="004"><img src="assets/p1-wire.png" alt="Lab 004" style="transform-origin:center; filter: grayscale(1) brightness(0.8) hue-rotate(90deg);"><span class="lab-id">EXP_004</span></div>
            <div class="lab-item reveal" data-id="005"><img src="assets/p2-wire.png" alt="Lab 005"><span class="lab-id">EXP_005</span></div>
            <div class="lab-item reveal" data-id="006"><img src="assets/p3-wire.png" alt="Lab 006"><span class="lab-id">EXP_006</span></div>
            <div class="lab-item reveal" data-id="007"><img src="assets/p1-final.png" alt="Lab 007" style="filter:invert(1) grayscale(0.5);"><span class="lab-id">EXP_007</span></div>
            <div class="lab-item reveal" data-id="008"><img src="assets/p2-final.png" alt="Lab 008" style="filter:sepia(1) hue-rotate(200deg) brightness(0.8);"><span class="lab-id">EXP_008</span></div>
